<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet OS · Book a chauffeur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-mode="airport">
    <div class="noise" aria-hidden="true"></div>
    <div class="cursor" id="cursor" aria-hidden="true"><i></i></div>
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <div class="app is-in" id="app">

      <header class="topbar">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <strong>Fleet OS</strong>
            <small>Chauffeur booking</small>
          </div>
        </div>
        <div class="live-pill">
          <i></i>
          <span><b class="count">24</b> cars on the network</span>
        </div>
      </header>

      <main class="hero">
        <section class="copy">
          <p class="kicker mask-in" data-copy="kicker">Airport corridors · meet & greet</p>
          <h1 class="display-title" data-copy="title">Your chauffeur is already moving toward you.</h1>
          <p class="lede mask-in" data-copy="lede">
            Track the flight, hold at arrivals, and open the door on time. One booking language for every journey.
          </p>
        </section>

        <form class="ticket" id="book" autocomplete="off">
          <div class="ticket-head">
            <span class="ticket-kicker">Book a movement</span>
            <span class="ticket-stamp" data-copy="stamp">Fixed fare</span>
          </div>

          <div class="tabs" role="tablist" aria-label="Service categories">
            <span class="tab-ink" id="tabInk"></span>
            <button type="button" class="tab is-active" role="tab" aria-selected="true" data-mode="airport">
              Airport Transfer
            </button>
            <button type="button" class="tab" role="tab" aria-selected="false" data-mode="p2p">
              Point to Point
            </button>
            <button type="button" class="tab" role="tab" aria-selected="false" data-mode="hourly">
              With Driver Car
            </button>
            <button type="button" class="tab" role="tab" aria-selected="false" data-mode="multi">
              Multiple City Trip
            </button>
          </div>

          <div class="fields" id="fields">
            <label class="field span-2" data-show="airport">
              <span>Direction</span>
              <div class="segment" id="direction">
                <button type="button" class="is-on" data-dir="arrival">Arrival · airport pickup</button>
                <button type="button" data-dir="departure">Departure · airport drop-off</button>
              </div>
            </label>

            <div class="loc-row">
              <label class="field">
                <span>Pickup location</span>
                <input id="pickup" name="pickup" placeholder="Taoyuan International Airport (TPE)" required />
              </label>
              <button type="button" class="swap" id="swap" aria-label="Swap pickup and drop-off">⇅</button>
              <label class="field">
                <span>Drop-off location</span>
                <input id="dropoff" name="dropoff" placeholder="Taipei 101, Xinyi" required />
              </label>
            </div>

            <div class="stops" id="stops" data-show="multi" hidden></div>
            <button type="button" class="add-stop" id="addStop" data-show="multi">+ Add another city</button>

            <label class="field" data-show="hourly">
              <span>Hours with driver</span>
              <input id="hours" type="number" min="2" max="24" value="4" />
            </label>

            <label class="field" data-show="airport">
              <span>Flight number</span>
              <input id="flight" placeholder="BR156" />
            </label>

            <label class="field">
              <span>Pickup date & time</span>
              <input id="when" type="datetime-local" required />
            </label>

            <label class="field">
              <span>Passengers</span>
              <input id="pax" type="number" min="1" max="14" value="2" />
            </label>
          </div>

          <div class="footer">
            <div class="quote">
              <small data-copy="quoteLabel">Estimated chauffeur fare</small>
              <strong id="fare">NT$2,280</strong>
            </div>
            <button class="cta" type="submit">
              <span>See cars & confirm</span>
              <i></i>
            </button>
          </div>
        </form>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="./app.js"></script>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
