[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "codire-reproduction"
version = "0.1.0"
description = "Auditable reproduction harness for Compatibility-guided Diverse Recombination"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.3",
  "scipy>=1.16",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
